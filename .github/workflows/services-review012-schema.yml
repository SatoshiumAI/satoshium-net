name: Services Review 012 Record Shape Diagnostic

on:
  push:
    branches: [phase004]
    paths:
      - '.github/workflows/services-review012-schema.yml'
      - 'services/reviews/services-review012-schema.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test valid and malformed JSON record shapes
        run: timeout 180s node services/reviews/services-review012-schema.cjs
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review012-record-shape
          path: services-review012-schema-results.json
          if-no-files-found: warn
