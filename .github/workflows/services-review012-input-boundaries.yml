name: Services Review 012 Aegis Input Boundaries

on:
  push:
    branches: [phase004]
    paths:
      - '.github/workflows/services-review012-input-boundaries.yml'
      - 'services/reviews/services-review012-input-boundaries.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Observe Aegis network abort and input cardinality
        run: timeout 160s node services/reviews/services-review012-input-boundaries.cjs
      - name: Preserve observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review012-input-boundaries
          path: services-review012-input-boundaries.json
          if-no-files-found: warn
