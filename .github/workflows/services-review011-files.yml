name: Services Review 011 File and Reflow Diagnostics

on:
  push:
    branches: [phase004]
    paths:
      - '.github/workflows/services-review011-files.yml'
      - 'services/reviews/services-review011-files.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-and-reflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check safe downloads, file chooser and narrow reflow
        run: timeout 180s node services/reviews/services-review011-files.cjs
      - name: Preserve observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review011-file-reflow
          path: services-review011-file-results.json
          if-no-files-found: warn
