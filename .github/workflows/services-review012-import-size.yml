name: Services Review 012 Import Size Baseline

on:
  push:
    branches: [phase004]
    paths:
      - '.github/workflows/services-review012-import-size.yml'
      - 'services/reviews/services-review012-import-size.cjs'
      - 'services/agent-governance/tool.html'
      - 'services/verification-ledger/tool.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-size:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Observe 2MiB padded JSON import without modifying user data
        run: timeout 170s node services/reviews/services-review012-import-size.cjs
      - name: Save bounded input-size observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review012-import-size
          path: services-review012-import-limit.json
          if-no-files-found: warn
