name: Suite IQ-001–011 Offline Evidence (noncanonical)
on:
  push:
    branches: [phase004]
    paths:
      - '.github/workflows/suite-iq001-offline-evidence.yml'
      - 'services/reviews/stage1e/**'
      - 'services/reviews/stage1h/**'
      - 'services/reviews/stage1i/**'
      - 'services/reviews/stage1j/**'
      - 'services/reviews/stage1k/**'
      - 'services/reviews/stage1l/**'
      - 'services/reviews/stage1m/**'
      - 'services/reviews/stage1n/**'
      - 'services/reviews/stage1o/**'
      - 'services/reviews/stage1p/**'
      - 'services/reviews/stage1q/**'
      - 'services/reviews/stage1r/**'
      - 'services/reviews/stage1s/**'
      - 'services/reviews/stage2b/**'
      - 'services/reviews/stage2e/**'
      - 'services/reviews/stage2f/**'
      - 'services/reviews/stage2g/**'
      - 'services/reviews/stage2h/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage 1E P0 evidence register self-tests
        run: node services/reviews/stage1e/p0-evidence-gate.test.cjs
      - name: Stage 1E P0 evidence register completeness check
        run: node services/reviews/stage1e/p0-evidence-gate.cjs
      - name: Stage 2H fictional owner acknowledgement self-tests
        run: node services/reviews/stage2h/acknowledgement-gate.test.cjs
      - name: Stage 2G fictional versioned trace and source impact checks
        run: node services/reviews/stage2g/impact-matrix.test.cjs
      - name: Stage 2F fictional historical state and transition checks
        run: node services/reviews/stage2f/historical-transition-gate.test.cjs
      - name: Stage 2E pinned controlled values conformance tests
        run: node services/reviews/stage2e/value-inspector.test.cjs
      - name: Stage 2B fictional Certifier Registry bridge contract checks
        run: node services/reviews/stage2b/candidate-bridge.test.cjs
      - name: Stage 1S IQ-011 cross-institution write audit tests
        run: node services/reviews/stage1s/write-audit.test.cjs
      - name: Stage 1R IQ-010 technical/institutional authority self-tests
        run: node services/reviews/stage1r/authority-gate.test.cjs
      - name: Stage 1Q IQ-009 Navigator retry/idempotency self-tests
        run: node services/reviews/stage1q/retry-gate.test.cjs
      - name: Stage 1P IQ-008 Navigator handoff contract self-tests
        run: node services/reviews/stage1p/handoff-contract.test.cjs
      - name: Stage 1O IQ-007 failure and unknown-state self-tests
        run: node services/reviews/stage1o/failure-classifier.test.cjs
      - name: Stage 1N IQ-006 typed-outcome namespace self-tests
        run: node services/reviews/stage1n/outcome-namespace.test.cjs
      - name: Stage 1M IQ-005 process subject-profile self-tests
        run: node services/reviews/stage1m/subject-profile.test.cjs
      - name: Stage 1L IQ-004 relationship serializer self-tests
        run: node services/reviews/stage1l/relationship-serializer.test.cjs
      - name: Stage 1K IQ-003 lifecycle publication state self-tests
        run: node services/reviews/stage1k/state-mapper.test.cjs
      - name: Stage 1J IQ-002 in-memory resolver self-tests
        run: node services/reviews/stage1j/resolver.test.cjs
      - name: Stage 1I fictional Registry-shaped adapter self-tests
        run: node services/reviews/stage1i/registry-source-reference-adapter.test.cjs
      - name: Stage 1H normalized reference envelope prototype self-tests
        run: node services/reviews/stage1h/reference-envelope-prototype.test.cjs
