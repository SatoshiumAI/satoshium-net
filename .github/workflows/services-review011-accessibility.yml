name: Services Review 011 Accessibility Diagnostics

on:
  push:
    branches: [phase004]
    paths:
      - '.github/workflows/services-review011-accessibility.yml'
      - 'services/reviews/services-review011-accessibility.cjs'
      - 'services/index.html'
      - 'services/aegis/aegis-service-panel.html'
      - 'services/agent-governance/tool.html'
      - 'services/verification-ledger/tool.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser diagnostic dependencies
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install --with-deps chromium
      - name: Record keyboard, mobile, and axe evidence
        run: timeout 230s node services/reviews/services-review011-accessibility.cjs
      - name: Preserve actual diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review011-accessibility-diagnostics
          path: services-review011-browser-results.json
          if-no-files-found: warn
